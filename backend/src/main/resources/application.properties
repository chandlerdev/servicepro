spring.application.name=servicepros-backend

# Local secrets live in backend/.env (copy .env.example). Real environment variables take precedence.
spring.config.import=optional:file:.env[.properties]

# ---------------- Database (MySQL) ----------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:servicepros}?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------------- JPA / Hibernate ----------------
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ---------------- Mail (optional; empty host = emails are simulated) ----------------
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------- Server ----------------
server.port=${SERVER_PORT:9091}
server.forward-headers-strategy=framework

# ---------------- API docs (Swagger UI) ----------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ---------------- Application ----------------
app.timezone=America/Chicago

# 3001 = admin panel, 3002 = Flutter app running in Chrome (flutter run -d chrome --web-port 3002)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:3002}

# Base64-encoded HMAC key (>= 64 bytes). CHANGE IN PRODUCTION via JWT_SECRET.
app.jwt.secret=${JWT_SECRET:TWsd5tuEFYAc9VT2AjMV3bIsJpBBjOyepgy8RreSiNq0pn6NsHFFNMR6AJ1p0AyTeYRsRPY/hI3EiaguVZ+s5w==}
app.jwt.access-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:30d}

app.rate-limit.login-per-minute=10
app.rate-limit.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

# Twilio SMS (empty = messages are logged as SIMULATED)
app.twilio.account-sid=${TWILIO_ACCOUNT_SID:}
app.twilio.auth-token=${TWILIO_AUTH_TOKEN:}
app.twilio.from-number=${TWILIO_FROM_NUMBER:}
# Public URL Twilio posts inbound SMS to (used to validate X-Twilio-Signature)
app.twilio.webhook-url=${TWILIO_WEBHOOK_URL:}

# Server-side Google key with Geocoding API + Routes API enabled
app.google.maps-api-key=${GOOGLE_MAPS_API_KEY:}
# address suggestions only from these countries (comma separated ISO codes)
app.google.places-regions=${GOOGLE_PLACES_REGIONS:us}

app.mail.from=${MAIL_FROM:no-reply@servicepros.local}

# First Super Admin login (created at startup only when no Super Admin exists yet)
app.super-admin.email=${SUPER_ADMIN_EMAIL:}
app.super-admin.password=${SUPER_ADMIN_PASSWORD:}

# Route optimizer
app.optimizer.avg-speed-kmh=32
app.optimizer.road-factor=1.25
app.optimizer.arrival-window-minutes=30

# ---------------- Logging ----------------
logging.level.com.servicepros=INFO


# ================= LIVE SERVER =================
# The section below is active only when started with the "prod" profile:
#   java -jar servicepros-backend-1.0.0.jar --spring.profiles.active=prod
# Values then come from backend/.env.prod (they override backend/.env).
# (Spring rule: the lines right before and after "#---" must not be comments.)
spring.application.name=servicepros-backend
#---
spring.config.activate.on-profile=prod
spring.config.import=optional:file:.env.prod[.properties]
