name: servicepros_tech
description: "ServProWare — technician mobile app (Android & iOS)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  intl: ^0.20.3
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.2
  http: ^1.6.0
  provider: ^6.1.5+1
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

  assets:
    - assets/splash/logo.png
    - assets/splash/branding.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
# Native splash screen — regenerate after changing: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A5C50"                      # AppColors.brandDark
  image: assets/splash/logo.png         # 4x image (960px → 240dp)
  branding: assets/splash/branding.png  # "ServProWare" wordmark (Poppins ExtraBold)
  branding_mode: bottom
  android_12:
    color: "#0A5C50"
    image: assets/splash/logo_android12.png
    branding: assets/splash/branding.png
  android: true
  ios: true
  web: true

# App icon — regenerate after changing: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png                      # 1024×1024, green background + yellow bolt
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0A5C50"                   # AppColors.brandDark
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true                                # App Store rejects icons with transparency
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#0A5C50"
    theme_color: "#0A5C50"
