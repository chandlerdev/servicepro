name: Release build

# Builds the backend and the admin web app on GitHub's machines and attaches
# them to a GitHub Release, which a server downloads with deploy/deploy.sh
# instead of building on itself. Nothing is built for a plain push - only for
# a version tag:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Nothing about any one site goes into the build. Ports, database, logins and
# addresses are read by each process when it starts, and the web app calls
# /api on whichever domain serves it.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # to create the Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build backend
        working-directory: backend
        run: mvn -B -q -DskipTests package

      - name: Collect backend jar
        run: cp backend/target/servicepros-backend-*.jar backend.jar

      # NEXT_OUTPUT=standalone gives a self-contained server (server.js and
      # the node_modules it needs); the static files are copied in beside it,
      # which standalone leaves out. The admin has no public/ folder.
      - name: Build admin web app
        working-directory: admin
        env:
          NEXT_OUTPUT: standalone
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.MAPS_KEY }}
        run: |
          npm ci
          npm run build
          test -f .next/standalone/server.js
          cp -r .next/static .next/standalone/.next/
          if [ -d public ]; then cp -r public .next/standalone/; fi

      - name: Package admin web app
        run: tar -czf admin.tar.gz -C admin/.next/standalone .

      - name: Keep the files on the run (manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: |
            backend.jar
            admin.tar.gz

      - name: Publish the Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            backend.jar
            admin.tar.gz
